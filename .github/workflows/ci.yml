name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/netdoctor
      - name: Run the built program for real and read the adapter
        shell: bash
        run: |
          # ND-164: on each real system the adapter must be read, not "unknown".
          ./netdoctor check --json --quick > check.json || true
          cat check.json
          if ! grep -Eq '"kind": "(wired|wifi)"' check.json; then
            echo "The adapter was not read on this system."
            exit 1
          fi
          if grep -q "not available on this system yet" check.json; then
            echo "A reader said it is not available on this system."
            exit 1
          fi
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the installer
        shell: pwsh
        run: scripts/build-installer.ps1
      - name: Install and uninstall every choice on a clean machine
        shell: pwsh
        run: scripts/test-installer.ps1 -Setup "$PWD\dist\release\NetworkDoctor-Setup-0.1.0.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/release/NetworkDoctor-Setup-0.1.0.zip
